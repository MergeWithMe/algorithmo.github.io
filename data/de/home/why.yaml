enable: true

title: "Warum mit uns arbeiten"
text: "Was uns unterscheidet"

points:
  - title: "Kein Overhead"
    text: "Kleines, schlagkräftiges Team ohne aufgeblähte Strukturen. Sie kommunizieren direkt mit den Entwicklern, die Ihr Produkt tatsächlich bauen – keine endlosen Meetings, keine überflüssigen Projektmanager. Schnelle Entscheidungen, echte Expertise, maximale Effizienz."

  - title: "DACH-Fokus"
    text: "Mit Sitz in Düsseldorf verstehen wir die deutsche Geschäftskultur, sprechen Ihre Sprache und kennen die regulatorischen Anforderungen. DSGVO-Compliance ist für uns selbstverständlich, nicht nachträglich. Wir entwickeln Lösungen, die von Anfang an den deutschen Markt im Blick haben."

  - title: "Produktionsqualität"
    text: "Wir schreiben Code, auf den wir stolz sind – sauber, getestet und wartbar. Keine Quick-Fixes oder technischen Schulden. Jedes Projekt wird so entwickelt, als würden wir es selbst langfristig betreiben müssen. Mit umfassender Dokumentation und Best Practices, die sich in der Praxis bewährt haben."

  - title: "Schnelle Umsetzung"
    text: "Die meisten Projekte starten innerhalb von 2 Wochen – ohne lange Vorlaufzeiten oder bürokratische Hürden. Sie erhalten regelmäßige Updates über den Projektfortschritt, transparente Kommunikation und keine unangenehmen Überraschungen. Wir liefern, was wir versprechen, und zwar pünktlich."
