{{ define "main" }}
  <section class="bg-gradient-to-br from-primary/5 to-secondary/5 py-32">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-primary mb-6 text-8xl xl:text-9xl font-bold">404</h1>
      <h2 class="text-4xl font-bold mb-6 text-gray-800">Page Not Found</h2>
      <p class="text-xl text-gray-600 mb-12 max-w-2xl mx-auto leading-relaxed">
        The page you're looking for doesn't exist or has been moved. Let's get you back on track.
      </p>
      <div class="flex gap-4 justify-center flex-wrap">
        <a href="/" class="inline-block bg-primary hover:bg-primary/90 text-white px-8 py-4 rounded-lg font-semibold text-lg transition-all">
          Go to Homepage
        </a>
        <a href="/services" class="inline-block border-2 border-primary text-primary hover:bg-primary hover:text-white px-8 py-4 rounded-lg font-semibold text-lg transition-all">
          View Services
        </a>
        <a href="/contact" class="inline-block border-2 border-primary text-primary hover:bg-primary hover:text-white px-8 py-4 rounded-lg font-semibold text-lg transition-all">
          Contact Us
        </a>
      </div>
    </div>
  </section>
{{ end }}
