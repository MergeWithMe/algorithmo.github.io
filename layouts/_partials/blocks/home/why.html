<section id="why" class="py-32 relative overflow-hidden" style="background: #ffffff;">
  <div class="container mx-auto px-4 relative z-10">
    <div class="text-center mb-24">
      {{ with .title }}
        <div class="inline-block mb-6">
          <div class="h-1 w-16 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full mx-auto"></div>
        </div>
        <h2 style="font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.02em; color: #111827;">{{ . }}</h2>
      {{ end }}
      {{ with .text }}
        <p style="font-size: 1.25rem; color: #4B5563; max-width: 42rem; margin: 0 auto; font-weight: 400;">{{ . }}</p>
      {{ end }}
    </div>
    {{ if .points }}
      <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-4 max-w-7xl mx-auto">
        {{ range $index, $point := .points }}
          <div class="text-center p-8 rounded-3xl bg-white border-2 border-gray-100 hover:border-purple-200 hover:shadow-2xl hover:shadow-purple-100 transition-all duration-500 group">
            <div class="w-20 h-20 mx-auto mb-8 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white text-3xl font-black shadow-xl shadow-purple-500/40 transition-all duration-500 group-hover:scale-110 group-hover:shadow-2xl group-hover:shadow-purple-500/60">
              {{ add $index 1 }}
            </div>
            <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #111827;">{{ .title }}</h3>
            <p style="font-size: 0.9375rem; color: #6B7280; line-height: 1.8; font-weight: 400;">{{ .text }}</p>
          </div>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
