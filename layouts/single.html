{{ define "main" }}
  <!-- Hero Section for Page -->
  <section style="background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #0F172A 100%); padding: 4rem 0 2rem; position: relative; overflow: hidden;">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);"></div>
    <div class="container mx-auto px-4" style="position: relative; z-index: 10;">
      {{ with .Title }}
        <h1 style="font-size: clamp(3rem, 6vw, 5rem); font-weight: 900; color: #ffffff; text-align: center; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 1rem;">{{ . }}</h1>
      {{ end }}
      {{ with .Params.description }}
        <p style="font-size: 1.125rem; color: #CBD5E1; text-align: center; max-width: 48rem; margin: 0 auto;">{{ . }}</p>
      {{ end }}
    </div>
  </section>

  <!-- Content Section -->
  <section style="padding: 3rem 0 4rem; background: linear-gradient(to bottom, #FFFFFF 0%, #F8FAFC 100%);">
    <div class="container mx-auto px-4">
      {{ with .Content }}
        <article style="max-width: 56rem; margin: 0 auto; font-size: 1.0625rem; line-height: 1.8; color: #334155;">
          <style>
            article h2 {
              font-size: 2rem;
              font-weight: 800;
              color: #0F172A;
              margin-top: 3rem;
              margin-bottom: 1.5rem;
              padding-bottom: 0.75rem;
              border-bottom: 3px solid #6366F1;
            }
            article h3 {
              font-size: 1.5rem;
              font-weight: 700;
              color: #1E293B;
              margin-top: 2rem;
              margin-bottom: 1rem;
            }
            article p {
              margin-bottom: 1.25rem;
              white-space: pre-line;
            }
            article strong {
              color: #0F172A;
              font-weight: 700;
              display: block;
              margin-top: 1rem;
            }
            article strong:first-child {
              margin-top: 0;
            }
            article a {
              color: #6366F1;
              text-decoration: underline;
              transition: color 0.2s;
            }
            article a:hover {
              color: #4F46E5;
            }
            article hr {
              margin: 3rem 0;
              border: none;
              height: 1px;
              background: linear-gradient(to right, transparent, #E2E8F0, transparent);
            }
          </style>
          {{ . }}
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
