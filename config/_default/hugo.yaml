baseURL: "https://algorithmo.de"
title: "Algorithmo GmbH"
summaryLength: 20
defaultContentLanguage: "de"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false

languages:
  de:
    languageName: "Deutsch"
    languageCode: "de-DE"
    weight: 1
    title: "Algorithmo GmbH"
  en:
    languageName: "English"
    languageCode: "en-US"
    weight: 2
    title: "Algorithmo GmbH"

# Menu Configuration
menus:
  de-main:
    - name: "Start"
      url: "/"
      weight: 1
    - name: "Über uns"
      url: "/about"
      weight: 2
  de-buttons:
    - name: "Kontakt"
      url: "/contact"
      weight: 1
  de-footer:
    - name: "Start"
      url: "/"
      weight: 1
    - name: "Über uns"
      url: "/about"
      weight: 2
  de-footer_legal:
    - name: "Impressum"
      url: "/impressum"
      weight: 1
    - name: "Datenschutz"
      url: "/datenschutz"
      weight: 2
  en-main:
    - name: "Home"
      url: "/en/"
      weight: 1
    - name: "About"
      url: "/en/about"
      weight: 2
  en-buttons:
    - name: "Contact"
      url: "/en/contact"
      weight: 1
  en-footer:
    - name: "Home"
      url: "/en/"
      weight: 1
    - name: "About"
      url: "/en/about"
      weight: 2
  en-footer_legal:
    - name: "Legal Notice"
      url: "/en/impressum"
      weight: 1
    - name: "Privacy Policy"
      url: "/en/datenschutz"
      weight: 2

# Sitemap Configuration
sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5

# Output Formats
outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
  section:
    - "HTML"
    - "RSS"

# Permalinks Configuration for SEO-friendly URLs
permalinks:
  post: "/:slug/"

# Taxonomy Configuration
taxonomies:
  tag: "tags"
  category: "categories"

