# About Page
- id: aboutHeroTitle
  translation: "Software Engineering in <span style='background: linear-gradient(135deg, #DDD6FE 0%, #F3E8FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;'>Düsseldorf</span>"

- id: aboutHeroSubtitle
  translation: "Wir entwickeln Software, die funktioniert. Gegründet 2026."

- id: whatWeDo
  translation: "Was wir machen"

- id: threeThingsGoodAt
  translation: "Drei Dinge, die wir wirklich gut können"

- id: fullStackDevDesc
  translation: "Wir entwickeln Apps und Backend-Systeme. Mobile, Web, APIs. React, React Native, Node.js, Python. Der übliche Stack."

- id: aiIntegrationDesc
  translation: "Wir verbinden KI mit bestehenden Produkten. OpenAI, Claude, Custom-Modelle. Was auch immer für das Problem Sinn macht."

- id: campaignOptDesc
  translation: "Wir richten Analytics ein und optimieren Werbekampagnen. Google Analytics, Meta Pixel, Conversion-Tracking."

- id: howWeWork
  translation: "Wie wir arbeiten"

- id: howWeWorkText1
  translation: "Wir sprechen mit Ihnen darüber, was Sie brauchen. Wir finden heraus, ob wir helfen können. Wenn ja, bauen wir es. Keine langen Proposals oder Strategy-Decks."

- id: howWeWorkText2
  translation: "Die meisten Projekte beginnen mit ein paar Wochen, um die Dinge richtig abzustecken. Dann bauen wir iterativ, damit Sie den Fortschritt sehen."

- id: ourApproach
  translation: "Unser Ansatz"

- id: talkUnderstand
  translation: "Sprechen & Verstehen"

- id: talkUnderstandDesc
