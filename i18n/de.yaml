  translation: "Ein paar Wochen, um die Anforderungen im Detail zu verstehen"

- id: buildIterations
  translation: "Iterativ entwickeln"

- id: buildIterationsDesc
  translation: "Sie sehen regelmäßig Fortschritt, wir passen bei Bedarf an"

